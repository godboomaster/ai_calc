name: Release Android

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo 'Expected a stable version tag such as v1.1.0' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run checks
        run: ./gradlew --no-daemon -PappVersion="$RELEASE_VERSION" :app:testDebugUnitTest :app:lintRelease
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Add the signing secrets described in docs/releases.md}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing signing alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/calculator-signing.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon -PappVersion="$RELEASE_VERSION" :app:assembleRelease
      - name: Verify and package APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          EXPECTED=$(tr -d '\r\n' < release-signing.sha256)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt")
          test "$ACTUAL" = "$EXPECTED" || { echo 'Signing certificate changed; refusing incompatible update' >&2; exit 1; }
          mkdir -p dist
          cp "$APK" dist/Calculator.apk
          (cd dist && sha256sum Calculator.apk > Calculator.apk.sha256)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Upload to a draft first; interrupted runs can resume without exposing partial releases.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" > /dev/null || {
              echo 'This release is already published; use a new version tag' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/Calculator.apk dist/Calculator.apk.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
